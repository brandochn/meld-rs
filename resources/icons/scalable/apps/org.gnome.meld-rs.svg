<?xml version="1.0" encoding="UTF-8"?>
<!--
  Meld-rs application icon.

  A side-by-side file comparison: two document panes whose changed line is
  highlighted in red (removed, left) and green (added, right), linked across
  the divider by a comparison connector. The accent colours match the red /
  green diff highlighting used throughout the app.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Meld-rs</title>
  <desc id="desc">Side-by-side file comparison: a removed (red) line on the left and an added (green) line on the right, linked across the divider.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C79F2"/>
      <stop offset="1" stop-color="#2A3B85"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bg-clip">
      <rect x="6" y="6" width="116" height="116" rx="27"/>
    </clipPath>
  </defs>

  <!-- Rounded backdrop -->
  <g clip-path="url(#bg-clip)">
    <rect x="6" y="6" width="116" height="116" fill="url(#bg)"/>
    <rect x="6" y="6" width="116" height="58" fill="url(#gloss)"/>
  </g>
  <rect x="7" y="7" width="114" height="114" rx="26" fill="none" stroke="#0B1430" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Two document panes (with soft drop shadow) -->
  <rect x="22" y="30" width="40" height="72" rx="7" fill="#0B1430" fill-opacity="0.20"/>
  <rect x="70" y="30" width="40" height="72" rx="7" fill="#0B1430" fill-opacity="0.20"/>
  <rect x="20" y="28" width="40" height="72" rx="6" fill="#FFFFFF"/>
  <rect x="68" y="28" width="40" height="72" rx="6" fill="#FFFFFF"/>

  <!-- Unchanged code lines -->
  <g fill="#C9D2E6">
    <rect x="26" y="38" width="22" height="4.6" rx="2.3"/>
    <rect x="26" y="48" width="28" height="4.6" rx="2.3"/>
    <rect x="26" y="68" width="20" height="4.6" rx="2.3"/>
    <rect x="26" y="78" width="25" height="4.6" rx="2.3"/>
    <rect x="26" y="88" width="16" height="4.6" rx="2.3"/>
    <rect x="74" y="38" width="20" height="4.6" rx="2.3"/>
    <rect x="74" y="48" width="26" height="4.6" rx="2.3"/>
    <rect x="74" y="68" width="23" height="4.6" rx="2.3"/>
    <rect x="74" y="78" width="22" height="4.6" rx="2.3"/>
    <rect x="74" y="88" width="18" height="4.6" rx="2.3"/>
  </g>

  <!-- Changed line: removed (red, left) / added (green, right) -->
  <rect x="26" y="57.3" width="28" height="6" rx="3" fill="#D64545"/>
  <rect x="74" y="57.3" width="28" height="6" rx="3" fill="#2EA25B"/>

  <!-- Minus / plus marks on the changed lines -->
  <rect x="30" y="59.3" width="6" height="2" rx="1" fill="#FFFFFF"/>
  <rect x="79" y="59.3" width="6" height="2" rx="1" fill="#FFFFFF"/>
  <rect x="81" y="57.3" width="2" height="6" rx="1" fill="#FFFFFF"/>

  <!-- Comparison connector linking the changed lines across the divider -->
  <line x1="54" y1="60.3" x2="60" y2="60.3" stroke="#5B8DEF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="60.3" x2="74" y2="60.3" stroke="#5B8DEF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M64 56.3 L68 60.3 L64 64.3 L60 60.3 Z" fill="#FFFFFF"/>
</svg>
