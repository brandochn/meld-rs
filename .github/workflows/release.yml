name: Release

# Builds the Linux AppImage.  It is published as a GitHub release only when a
# version tag is pushed; every other trigger just verifies the packaging.
#
#   * `pull_request` (targeting main) and `workflow_dispatch` build and test the
#     AppImage and keep it as a workflow artifact, so the packaging can be
#     smoke-tested without publishing anything.
#   * Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
#     additionally creates the release for that tag and uploads the AppImage.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Needed to create the release and upload its assets.
permissions:
  contents: write

jobs:
  appimage:
    name: Build and publish AppImage
    # Pinned to the oldest supported LTS on purpose.  The AppImage bundles the
    # GTK stack but not glibc, so building on an older release keeps it
    # runnable on more systems.  It is also an exact match for the crate
    # features in Cargo.toml (gtk4 v4_14, sourceview5 v5_12, libadwaita v1_5).
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      # linuxdeploy is itself an AppImage and the runner ships no libfuse2;
      # extract-and-run makes it work without mounting.
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            adwaita-icon-theme \
            desktop-file-utils \
            file \
            gettext \
            libadwaita-1-dev \
            libglib2.0-bin \
            libglib2.0-dev-bin \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            patchelf \
            pkg-config \
            wget

      - name: Show tool versions
        run: |
          cargo --version
          rustc --version
          pkg-config --modversion gtk4 gtksourceview-5 libadwaita-1

      - name: Run tests
        run: cargo test --no-default-features

      - name: Check that the tag matches the Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${version}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the Cargo.toml version ${version}."
            exit 1
          fi
          echo "Building meld-rs ${version} from tag ${GITHUB_REF_NAME}."

      - name: Build the AppImage
        run: ./scripts/build-appimage.sh

      - name: Validate the desktop entry
        run: |
          desktop="target/release/share/applications/org.gnome.meld-rs.desktop"
          desktop-file-validate "$desktop"
          grep -qx 'Name=Meld-rs' "$desktop"
          if grep -q '^Name\[' "$desktop"; then
            echo "::error::Localized Name keys are not expected"
            exit 1
          fi
          grep -qx 'Comment\[de\]=Dateien vergleichen und zusammenführen' "$desktop"
          grep -qx 'GenericName\[de\]=Diff-Betrachter' "$desktop"
          if grep -q '^_' "$desktop"; then
            echo "::error::Underscore-prefixed keys found"
            exit 1
          fi

      - name: Upload the AppImage as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meld-rs-appimage
          path: publish/*.AppImage
          if-no-files-found: error

      # Only tag pushes publish a release; PR and manual runs stop above.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" publish/*.AppImage --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              publish/*.AppImage
          fi
